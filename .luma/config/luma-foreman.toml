# How luma-foreman behaves in this project. Committed, and shared by everyone.
#
# Kept minimal by design. What you leave out follows the tool and improves with
# it; what you set here is frozen, and every frozen value is one more thing to
# reconcile at upgrade.

[catalog]
# Where `luma-foreman get` takes bundles from when no --from is given.
# No default — nothing can guess which catalog is yours.
# source = "https://github.com/LumaStack/luma-catalog"

# Words this project retired. `luma-foreman inspect` reports each use as a
# notice — never a finding, because a grep cannot tell a revival from an
# ordinary use of the same word, and the reader has to decide.
#
# Nothing is retired by default. This is here because ADR-0003 says so.

# `except` names documents that discuss the retirement itself. The record that
# decided it is exempt automatically; anything else arguing about the word has
# to be listed, so an exemption is a choice somebody made rather than a hole.
#
# An entry is removed when the thing the word named no longer exists — not
# after a number of releases, and not because the count has been zero for a
# while. ADR-0005 has the argument. `refit` qualifies; the other two do not.
# `refit` was released 2026-08-26 under ADR-0005: the command was removed rather
# than renamed, so there is nothing left for anybody to reach for a word about.
# The other two name things still in the product under other names, so they stay.

# `preload` carries no `decided`, unlike the two below. It was not retired by a
# decision of this project — the field was removed and replaced upstream, in the
# format and in `luma-leader`'s loading-mechanisms draft. `decided` exempts
# records by filename prefix, which an external reference cannot use, so it is
# left out rather than filled with something that resolves to nothing.
#
# It stays retired for the same reason `projection` and `outfit` do: the thing it
# named still exists under another name.

[[retired]]
term = "preload"
use = "`matches` — what surfaces a Document — or nothing"
except = [
  "src/foreman/apply.py",       # reads the old field only so it can report it
  "tests/adopt-test.sh",        # builds a fixture declaring it, to test that report
  "tests/apply-test.sh",        # ...and this one pins the message
  "CHANGELOG.md",               # records what was true when written
  ".luma/records/decisions/ADR-0001-apply-writes-adapters-not-copies.md",  # ...as does a record
  "docs/scope.md",              # argues about the shape of the field it replaced
  ".luma/backlog/ideas/preload-levels-collapse-into-emphasis.md",   # is the retirement
  ".luma/backlog/ideas/routers.md",                                 # ...and these three
  ".luma/backlog/ideas/bundle-routines.md",                         # ...argue about it
  ".luma/backlog/ideas/apply-writes-an-entry-point-not-an-index.md",
]

[[retired]]
term = "projection"
use = "what `apply` writes, or `apply` itself"
decided = ["ADR-0003", "ADR-0005"]
except = [
  "src/foreman/cli.py",                       # RENAMED has to name the old word
  "src/foreman/inspect/rules/vocabulary.py",  # ...and this rule explains the word
  "tests/agent-permissions-cli-test.sh",      # ...and the tests pin those messages
  "tests/inspect-test.sh",                    # ...and its fixtures use it as data
]

[[retired]]
term = "outfit"
use = "`apply`"
decided = ["ADR-0003", "ADR-0004", "ADR-0005"]
except = [
  "src/foreman/cli.py",                       # RENAMED has to name the old word
  "tests/adopt-test.sh",                      # ...and one test builds an old marker
  "tests/agent-permissions-cli-test.sh",      # ...and the tests pin those messages
  "tests/inspect-test.sh",                    # ...and its fixtures use it as data
]
